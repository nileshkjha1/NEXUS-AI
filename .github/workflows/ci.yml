name: NEXUS AI Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Testing & Quality Verification
  # ============================================================================
  backend-tests:
    name: Backend Pytest & Syntax Verification (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies (libgomp1 for FAISS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Code Syntax
        run: |
          python -m compileall backend/app backend/tests

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-nexus-testing"
          JWT_SECRET_KEY: "ci-jwt-secret-key-nexus-testing"
        run: |
          python -m pytest backend/tests -v --durations=10

  # ============================================================================
  # 2. Frontend Build & Static Asset Verification
  # ============================================================================
  frontend-build:
    name: Frontend Vite Production Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Production Bundle
        run: |
          npm run build

  # ============================================================================
  # 3. Docker Compose & Configuration Validation
  # ============================================================================
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config --quiet

